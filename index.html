<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Joggofi Atacado — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--or:#F58635;--or-d:#C9631A;--or-soft:#FFF1E6;--bg:#F6F4F2;--card:#FFFFFF;--ink:#1B1714;--mute:#7A716B;--line:#E7E1DC;--ok:#2E7D4F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151210;--card:#211C19;--ink:#F3EEEA;--mute:#A99F98;--line:#352E2A;--or-soft:#3A2414}}
:root[data-theme="dark"]{--bg:#151210;--card:#211C19;--ink:#F3EEEA;--mute:#A99F98;--line:#352E2A;--or-soft:#3A2414}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--or);box-shadow:0 2px 14px rgba(0,0,0,.12)}
.bar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.bar img{height:40px;width:auto}
.bar .tag{margin-left:auto;color:#fff;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.preview{background:#1B1714;color:#F6C9A5;text-align:center;font-size:12px;padding:7px 12px;font-weight:500}
main{max-width:1180px;margin:0 auto;padding:22px 18px 140px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.intro h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1}
.intro h1 span{color:var(--or)}
.intro p{margin:6px 0 0;color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.08)}
.ph{aspect-ratio:3/4;background:#D9D2CD center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#8d847e;font-size:12px;font-weight:600}
.info{padding:12px 13px 14px}
.ref{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.06em}
.nm{font-size:14px;font-weight:700;margin:3px 0 8px;line-height:1.25;min-height:2.5em}
.row{display:flex;align-items:center;justify-content:space-between}
.pr{font-weight:800;font-size:16px}.pr small{font-weight:500;color:var(--mute);font-size:11px}
.dots{display:flex}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--card);margin-left:-4px;box-shadow:0 0 0 1px var(--line)}
.badge{position:absolute;top:10px;left:10px;background:var(--or);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,15,12,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:860px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh{display:grid;grid-template-columns:150px 1fr;gap:16px}
@media(min-width:760px){.sh{grid-template-columns:240px 1fr}}
.sh .ph{border-radius:12px}
.x{float:right;border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
h2{margin:2px 0 4px;font-size:20px;font-weight:800}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px 6px 7px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.swb i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swb.on{border-color:var(--or);background:var(--or-soft)}
.swb b{background:var(--or);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.swb.out{opacity:.4}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.sz{border:1.5px solid var(--line);border-radius:12px;padding:10px}
.sz .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.sz .t span{font-weight:500;font-size:11px;color:var(--mute)}
.step{display:flex;align-items:center;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;font-size:18px;cursor:pointer}
.step input{width:100%;border:0;text-align:center;font:700 15px inherit;font-family:inherit;background:var(--card);color:var(--ink);height:36px;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.sz.esg{opacity:.45}
.done{margin-top:18px;width:100%;border:0;background:var(--ink);color:var(--bg);font:700 15px inherit;font-family:inherit;padding:14px;border-radius:12px;cursor:pointer}
/* cart bar */
.cart{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.cart .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px}
.prog{flex:1}
.prog .t{font-size:13px;font-weight:600}.prog .t b{font-size:16px}
.track{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.track div{height:100%;background:var(--or);width:0;transition:width .25s}
.go{border:0;background:var(--or);color:#fff;font:700 14px inherit;font-family:inherit;padding:13px 20px;border-radius:12px;cursor:pointer;white-space:nowrap}
.go:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
/* review */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.f label{font-size:12px;font-weight:600;display:grid;gap:5px}
.f .full{grid-column:1/-1}
.f input[type=text]{border:1.5px solid var(--line);border-radius:10px;padding:11px;font:500 14px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.f input[type=text]:focus{outline:none;border-color:var(--or)}
.ck{display:flex!important;grid-template-columns:none;align-items:flex-start;gap:9px;font-weight:500!important}
.ck a{color:var(--or);font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:12px 0 4px}
.csv{background:var(--bg);border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre;overflow-x:auto}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.rm{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
</style>
</head>

<div class="preview">Atacado · pedido mínimo de 20 peças</div>
<main>
  <div class="intro">
    <div><h1>Coleção <span>Joggofi</span></h1><p>Pedido mínimo de 20 peças, variando modelos, cores e tamanhos.</p></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="cart"><div class="in">
  <div class="prog"><div class="t" id="ct"></div><div class="track"><div id="tr"></div></div></div>
  <button class="go" id="go" disabled>Revisar pedido</button>
</div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="config.js"></script>
<script>
let D=[];
const SUP='5581997681096'; // suporte Joggofi
const MIN=20;
const POL='https://drive.google.com/file/d/19X6rzpl-n8nexwN7u1v4X7FUBsDBSRMp/view';
const CATS=[['all','Todos'],['F','Feminino'],['M','Masculino'],['P','Plus Size']];
let filt='all', cart={}; // key id|cor|tam -> qty
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inCat(p){return filt==='all'||(filt==='P'?p.cat.endsWith('P'):(p.cat===filt))}
function qtyOf(id){let n=0;for(const k in cart)if(k.split('|')[0]===id)n+=cart[k];return n}
function chips(){$('chips').innerHTML=CATS.map(([k,l])=>`<button class="chip ${filt===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.k;chips();grid()})}
function grid(){$('grid').innerHTML=D.filter(inCat).map(p=>{const q=qtyOf(p.id);
  return `<div class="card" data-id="${p.id}">${q?`<span class="badge">${q} no pedido</span>`:''}
  <div class="ph" style="${p.photo?`background-image:url(${p.photo})`:''}">${p.photo?'':'Foto em breve'}</div>
  <div class="info"><div class="ref">REF ${esc(p.id)}</div><div class="nm">${esc(p.name)}</div>
  <div class="row"><div class="pr">${brl(p.price)}<small> /peça</small></div>
  <div class="dots">${p.colors.slice(0,5).map(c=>`<i style="background:${c.h}"></i>`).join('')}</div></div></div></div>`}).join('');
  $('grid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openP(c.dataset.id))}
function bar(){let n=0,v=0;for(const k in cart){const p=D.find(x=>x.id===k.split('|')[0]);n+=cart[k];v+=cart[k]*p.price}
  $('ct').innerHTML=n>=MIN?`<b>${n} peças</b> · ${brl(v)}`:`<b>${n} peças</b> · faltam ${MIN-n} para o mínimo`;
  $('tr').style.width=Math.min(100,n/MIN*100)+'%';$('go').disabled=n<MIN}
function openP(id){const p=D.find(x=>x.id===id);let sel=p.colors.findIndex(c=>Object.values(c.s).some(v=>v>0));if(sel<0)sel=0;
  const draw=()=>{const c=p.colors[sel];
   $('sheet').innerHTML=`<button class="x" id="x">×</button><div class="sh">
   <div class="ph" style="${p.photo?`background-image:url(${p.photo})`:''}">${p.photo?'':'Foto em breve'}</div>
   <div><div class="ref">REF ${esc(p.id)}</div><h2>${esc(p.name)}</h2><div class="pr">${brl(p.price)}<small> /peça</small></div>
   <div class="lbl">Cor</div><div class="sw">${p.colors.map((c,i)=>{const q=Object.keys(c.s).reduce((a,s)=>a+(cart[`${p.id}|${c.n}|${s}`]||0),0);const tot=Object.values(c.s).reduce((a,b)=>a+b,0);
     return `<button class="swb ${i===sel?'on':''} ${tot?'':'out'}" data-i="${i}"><i style="background:${c.h}"></i>${esc(c.n)}${q?` <b>${q}</b>`:''}</button>`}).join('')}</div>
   </div></div>
   <div class="lbl">Tamanhos — ${esc(c.n)}</div><div class="sizes">${p.sizes.map(s=>{const st=c.s[s]||0,k=`${p.id}|${c.n}|${s}`,q=cart[k]||0;
     return `<div class="sz ${st?'':'esg'}"><div class="t">${s}<span>${st?st+' disp.':'esgotado'}</span></div>
     <div class="step"><button data-k="${k}" data-d="-1" ${st?'':'disabled'}>−</button><input inputmode="numeric" value="${q}" data-k="${k}" data-m="${st}" ${st?'':'disabled'}><button data-k="${k}" data-d="1" ${st?'':'disabled'}>+</button></div></div>`}).join('')}</div>
   <button class="done" id="dn">Continuar escolhendo</button>`;
   $('x').onclick=$('dn').onclick=close;
   $('sheet').querySelectorAll('.swb').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;draw()});
   $('sheet').querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const inp=$('sheet').querySelector(`input[data-k="${b.dataset.k}"]`);set(b.dataset.k,(+inp.value||0)+(+b.dataset.d),+inp.dataset.m);draw()});
   $('sheet').querySelectorAll('.step input').forEach(i=>i.onchange=()=>{set(i.dataset.k,parseInt(i.value)||0,+i.dataset.m);draw()});
  };draw();$('ov').classList.add('show')}
function set(k,v,m){v=Math.max(0,Math.min(m,v));if(v)cart[k]=v;else delete cart[k];bar();grid()}
function close(){$('ov').classList.remove('show')}
$('ov').onclick=e=>{if(e.target.id==='ov')close()};
function lines(){return Object.keys(cart).map(k=>{const[id,c,s]=k.split('|');const p=D.find(x=>x.id===id);return{id,name:p.name,c,s,q:cart[k],u:p.price,t:cart[k]*p.price}}).sort((a,b)=>a.id.localeCompare(b.id))}
$('go').onclick=review;
function review(){const L=lines(),n=L.reduce((a,l)=>a+l.q,0),v=L.reduce((a,l)=>a+l.t,0);
  $('sheet').innerHTML=`<button class="x" id="x">×</button><h2>Revisar pedido</h2>
  <div class="tw"><table><tr><th>Ref</th><th>Produto</th><th>Cor</th><th>Tam.</th><th class="n">Qtd</th><th class="n">Total</th><th></th></tr>
  ${L.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.name)}</td><td>${esc(l.c)}</td><td>${l.s}</td><td class="n">${l.q}</td><td class="n">${brl(l.t)}</td><td><button class="rm" data-k="${esc(l.id+'|'+l.c+'|'+l.s)}">×</button></td></tr>`).join('')}</table></div>
  <div class="tot"><span>${n} peças</span><span>${brl(v)}</span></div>
  <div class="lbl">Seus dados</div>
  <div class="f"><label class="full">Nome / Loja<input type="text" id="fn"></label>
  <label>CPF ou CNPJ<input type="text" id="fd" inputmode="numeric"></label><label>WhatsApp<input type="text" id="fw" inputmode="tel" placeholder="81 99999-9999"></label>
  <label>Nome da excursão<input type="text" id="fe" placeholder="Ex.: Excursão do João"></label><label>Cidade de destino<input type="text" id="fc" placeholder="Ex.: Caruaru - PE"></label>
  <label class="full ck"><input type="checkbox" id="fa"> <span>Li e aceito as <a href="${POL}" target="_blank" rel="noopener">Políticas de Vendas, Trocas e Devoluções</a></span></label></div>
  <button class="done" id="send" style="background:var(--or);color:#fff">Enviar pedido</button>
  <div class="note">Frete combinado entre o cliente e a excursão. Pagamento via Pix ou cartão de crédito (link).</div>`;
  $('x').onclick=close;
  $('sheet').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{delete cart[b.dataset.k];bar();grid();if(Object.values(cart).reduce((a,b)=>a+b,0)>=MIN)review();else close()});
  $('send').onclick=()=>{const fn=$('fn').value.trim(),fd=$('fd').value.trim(),fw=$('fw').value.trim(),fe=$('fe').value.trim(),fc=$('fc').value.trim();
    if(!fn||!fd||!fw||!fe||!fc){alert('Preencha todos os campos, inclusive a excursão e a cidade.');return}if(!$('fa').checked){alert('É preciso aceitar as políticas de venda.');return}
    showCsv(L,{fn,fd,fw,fe,fc})};
  $('ov').classList.add('show')}
async function showCsv(L,c){const b=$('send');b.disabled=true;b.textContent='Enviando...';
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({cliente:c,itens:L.map(l=>({id:l.id,c:l.c,s:l.s,q:l.q}))})});
    const j=await r.json();
    if(!j.ok){alert(j.erro||'Não foi possível registrar o pedido.');b.disabled=false;b.textContent='Enviar pedido';return}
    cart={};bar();grid();
    $('sheet').innerHTML=`<button class="x" id="x">×</button><h2>Falta só um toque!</h2>
    <p style="font-size:14px;margin:6px 0 14px">Seu pedido <b>nº ${esc(j.num)}</b> foi registrado. Envie para o nosso suporte pelo WhatsApp para combinar o pagamento e a entrega na excursão.</p>
    <a class="done" style="display:block;text-align:center;text-decoration:none;background:#1FA855;color:#fff" target="_blank" rel="noopener" href="${esc(j.whats)}">Enviar pedido no WhatsApp</a>
    <p class="note">Se o WhatsApp não abrir, envie o número do pedido para (81) 99768-1096.</p>`;
    $('x').onclick=close;
  }catch(e){alert('Falha de conexão. Tente novamente.');b.disabled=false;b.textContent='Enviar pedido'}}
async function load(){$('grid').innerHTML='<p style="color:var(--mute)">Carregando catálogo...</p>';
  try{const r=await fetch(API+'?acao=catalogo');const j=await r.json();
    D=j.items.map(p=>({...p,photo:encodeURIComponent(p.id)+'.jpg'}));chips();grid();bar();}
  catch(e){$('grid').innerHTML='<p>Não foi possível carregar o catálogo agora. Atualize a página em alguns instantes.</p>'}}
load();
</script>
</body>
</html>
